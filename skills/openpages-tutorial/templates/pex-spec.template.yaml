# Policy Exception (PEX) - tutorial solution for learner {{CODE}}.
# Generated by `tutorial.py start --code {{CODE}}`. This file is YOURS: the lessons ask you to read it, change it and build
# from it. The answer key is skills/openpages-tutorial/templates/pex-spec.template.yaml.
#
# Shared environment rule: EVERY name you create carries your code.
#   system names   start with {{KEY}}            ({{KEY}}Exception, {{KEY}}-Exc, {{KEY}} Exception Lifecycle ...)
#   labels         start with "{{CODE}} "         ("{{CODE}} Policy Exception") so you can tell your items apart in the UI
#   test objects   start with "{{CODE}}-TEST"
# `tutorial.py check` refuses names without it. System names are IMMUTABLE once built: lesson 02 is the last chance.
#
# Story: a process owner asks for a time-limited exception to a policy (e.g. "privileged accounts without MFA until
# the new PAM tool is live"). The exception lists compensating controls; it can be approved only when it has at least
# one control and none is still Proposed. A questionnaire on the Process raises exceptions automatically.

solution:
  name: "{{CODE}} Policy Exception"
  key: {{KEY}}
  version: 0.1.0
  target_version: 9.2.1
  owner: {{OWNER}}
  tutorial: { code: "{{CODE}}", lesson_spec: true }
  description: >
    Tutorial solution. Policy Exception (under a Process, optionally linked to a Policy) owns Compensating Controls.
    Lifecycle: Draft -> Review -> Approved -> Expired, with rework and reject.

# Lesson 03 creates the types, lesson 04 the relationships (parents/children), lesson 05 the field groups.
object_types:
  - name: {{KEY}}Exception
    template: SOXIssue                  # a business record with its own lifecycle
    label: "{{CODE}} Policy Exception"
    plural_label: "{{CODE}} Policy Exceptions"
    description: "Tutorial ({{CODE}}): time-limited exception to a policy"
    parents:
      - { type: SOXProcess, primary: true, max_parents: 1 }   # the process the exception applies to (questionnaire asset)
      - { type: Policy }                                       # optional link to the policy being excepted
    children: [{{KEY}}Control]
    field_groups:
      - name: {{KEY}}-Exc
        description: "{{CODE}} Policy Exception fields"
        fields:
          - { name: Status, type: enum, required: true, values: [Draft, In Review, Approved, Rejected, Expired], default: Draft, search: true }
          - { name: Risk Rating, type: enum, required: true, values: [Low, Medium, High] }
          # Not required at creation (the questionnaire response action creates exceptions without them);
          # the workflow's Submit action validates them instead. Required-at-create vs required-to-progress is a design choice.
          - { name: Justification, type: long_string }
          - { name: Requested Expiry, type: date }
          - { name: Exception Owner, type: user_group }
          - { name: Estimated Exposure, type: currency }
          - { name: Renewal Requested, type: boolean, default: false }
          # Built BY HAND in lesson 05 (gen_fields has no confirmed encoding for these types yet):
          - { name: Exception Category, type: multi_enum, values: [Access, Configuration, Data Retention, Vendor, Other] }
          - { name: Inherent Risk Score, type: decimal, min: 0, max: 10 }
          # Set by calculations (lesson 07). Keep them read-only on views.
          - { name: Days to Expiry, type: integer }        # automatic calculation
          - { name: Open Controls, type: integer }         # manual calculation, run by the workflow
          - { name: Total Controls, type: integer }        # same manual calculation

  - name: {{KEY}}Control
    template: SOXTask                   # light child item
    label: "{{CODE}} Compensating Control"
    plural_label: "{{CODE}} Compensating Controls"
    description: "Tutorial ({{CODE}}): control that reduces the risk while the exception is open"
    parents:
      - { type: {{KEY}}Exception, primary: true }
    field_groups:
      - name: {{KEY}}-Ctl
        description: "{{CODE}} Compensating Control fields"
        fields:
          - { name: Status, type: enum, required: true, values: [Proposed, Implemented, Verified], default: Proposed, search: true }
          - { name: Control Description, type: long_string, required: true }
          - { name: Effectiveness, type: enum, values: [Not Tested, Effective, Partially Effective, Ineffective], default: Not Tested }
          - { name: Implementation Date, type: date }
          - { name: Coverage Percent, type: integer, min: 0, max: 100 }

profiles:
  # The profile your users work in. Lesson 06 checks which one the shared environment uses; change it here if needed.
  - OpenPages Modules Master

filters:
  - { name: "{{KEY}} Open Exceptions", object_type: {{KEY}}Exception, criteria: "{{KEY}}-Exc:Status != Expired" }
  - { name: "{{KEY}} Expiring Soon", object_type: {{KEY}}Exception, criteria: "{{KEY}}-Exc:Days to Expiry <= 30" }

views:
  - name: {{KEY}}Exception-Task
    type: task
    object_type: {{KEY}}Exception
    copy_from: system
    sections:
      - title: Request
        fields: [Name, Description, "{{KEY}}-Exc:Status", "{{KEY}}-Exc:Risk Rating", "{{KEY}}-Exc:Exception Category",
                 "{{KEY}}-Exc:Exception Owner", "{{KEY}}-Exc:Requested Expiry"]
      - title: Justification
        fields: ["{{KEY}}-Exc:Justification", "{{KEY}}-Exc:Inherent Risk Score", "{{KEY}}-Exc:Estimated Exposure", "{{KEY}}-Exc:Renewal Requested"]
      - title: Calculated (read-only)
        fields: ["{{KEY}}-Exc:Days to Expiry", "{{KEY}}-Exc:Open Controls", "{{KEY}}-Exc:Total Controls"]
    relationships:
      - { kind: grid, relationship: Children, object_type: {{KEY}}Control, actions: [New, Add, Delete],
          fields: [Name, "{{KEY}}-Ctl:Status", "{{KEY}}-Ctl:Effectiveness", "{{KEY}}-Ctl:Coverage Percent"] }
      - { kind: card, relationship: Parents, object_type: SOXProcess, actions: [Add, Set Primary Parent] }
      - { kind: card, relationship: Parents, object_type: Policy, actions: [Add] }
  - name: {{KEY}}Exception-Grid
    type: grid
    object_type: {{KEY}}Exception
    columns: [Name, "{{KEY}}-Exc:Status", "{{KEY}}-Exc:Risk Rating", "{{KEY}}-Exc:Requested Expiry", "{{KEY}}-Exc:Days to Expiry"]
  - name: {{KEY}}Exception-Create
    type: creation
    object_type: {{KEY}}Exception
    fields: [Name, Description, "{{KEY}}-Exc:Risk Rating", "{{KEY}}-Exc:Exception Category", "{{KEY}}-Exc:Justification",
             "{{KEY}}-Exc:Requested Expiry", "{{KEY}}-Exc:Exception Owner"]

calculations:
  - name: {{KEY}} Days to Expiry
    object_type: {{KEY}}Exception
    type: automatic             # re-runs when an input changes (NOT every night: the value goes stale; lesson 07)
    description: Days from today to the requested expiry date.
    inputs:
      - { name: Expiry, relationship: self, field: "{{KEY}}-Exc:Requested Expiry" }
    set:
      - { field: "{{KEY}}-Exc:Days to Expiry", expression: "if exists([$Expiry$]) then [$DaysFromNow/{{KEY}}-Exc:Requested Expiry$] else 0 endif" }
  - name: {{KEY}} Control Counts
    object_type: {{KEY}}Exception
    type: manual                # started only by the workflow's "Run calculation" operation (lesson 08)
    description: Counts compensating controls (all, and still Proposed); the Approve action validates both.
    inputs:
      - { name: OpenCtl, relationship: child, object_type: {{KEY}}Control, field: "{{KEY}}-Ctl:Status",
          filter: "{{KEY}}-Ctl:Status = Proposed" }
      - { name: AllCtl, relationship: child, object_type: {{KEY}}Control, field: "System Fields:Name" }
    set:
      - { field: "{{KEY}}-Exc:Open Controls", expression: "if exists([$OpenCtl$]) then count([$OpenCtl$]) else 0 endif" }
      - { field: "{{KEY}}-Exc:Total Controls", expression: "if exists([$AllCtl$]) then count([$AllCtl$]) else 0 endif" }

workflows:
  - name: {{KEY}} Exception Lifecycle
    object_type: {{KEY}}Exception
    start: auto                 # starts when an exception is created (also by the questionnaire response action)
    execute_as_system: false
    stages:
      - { name: Start, type: start, actions: [ { name: Begin, to: Draft, sets: { "{{KEY}}-Exc:Status": Draft } } ] }
      - name: Draft
        assignee: "field:{{KEY}}-Exc:Exception Owner"
        view: {{KEY}}Exception-Task
        actions:
          - { name: Submit, to: Review,
              validations: ["{{KEY}}-Exc:Justification is not empty (message: Explain why the exception is needed)",
                            "{{KEY}}-Exc:Requested Expiry is not empty (message: Set the requested expiry date)",
                            "{{KEY}}-Exc:Exception Owner is not empty (message: Name the exception owner)"],
              sets: { "{{KEY}}-Exc:Status": In Review } }
      - name: Review
        assignee: "user:{{OWNER}}"   # tutorial: you review your own exceptions. Real solutions use a reviewer group
        actions:
          # order matters: refresh the counts, then validate, then set Status
          - { name: Approve, to: Approved, operations: ["run calculation: {{KEY}} Control Counts"],
              validations: ["{{KEY}}-Exc:Total Controls >= 1 (message: Add at least one compensating control)",
                            "{{KEY}}-Exc:Open Controls = 0 (message: Every control must be Implemented or Verified)"],
              sets: { "{{KEY}}-Exc:Status": Approved } }
          - { name: Rework, to: Draft, comment: optional, sets: { "{{KEY}}-Exc:Status": Draft } }
          - { name: Reject, to: End, comment: optional, sets: { "{{KEY}}-Exc:Status": Rejected } }
      - name: Approved
        actions:
          - { name: Expire, to: End, sets: { "{{KEY}}-Exc:Status": Expired } }
      - { name: End, type: end }

tests:
  fixtures:
    process: "SOXProcess:{{PROCESS}}"   # created by you in lesson 01 (id or Type:Name)
  scenarios:
    - name: happy path to expired
      create:
        - { ref: ex1, type: {{KEY}}Exception, name: "{{CODE}}-TEST Exception {run}", parent: "@process",
            fields: { "{{KEY}}-Exc:Risk Rating": High, "{{KEY}}-Exc:Justification": "PAM tool not live yet",
                      "{{KEY}}-Exc:Requested Expiry": "2026-12-31", "{{KEY}}-Exc:Exception Owner": [{{OWNER}}] } }
        - { ref: c1, type: {{KEY}}Control, name: "{{CODE}}-TEST Control {run}", parent: "@ex1",
            fields: { "{{KEY}}-Ctl:Status": Implemented, "{{KEY}}-Ctl:Control Description": "Weekly review of privileged sessions" } }
      workflow:
        object: "@ex1"
        expect_stage: Draft
        steps:
          - { action: Submit,  expect_stage: Review,   expect_fields: { "{{KEY}}-Exc:Status": In Review } }
          - { action: Approve, expect_stage: Approved, expect_fields: { "{{KEY}}-Exc:Status": Approved, "{{KEY}}-Exc:Total Controls": 1, "{{KEY}}-Exc:Open Controls": 0 } }
          - { action: Expire,  expect_state: completed }
    - name: rework loop
      create:
        - { ref: ex2, type: {{KEY}}Exception, name: "{{CODE}}-TEST Rework {run}", parent: "@process",
            fields: { "{{KEY}}-Exc:Risk Rating": Low, "{{KEY}}-Exc:Justification": "x",
                      "{{KEY}}-Exc:Requested Expiry": "2026-12-31", "{{KEY}}-Exc:Exception Owner": [{{OWNER}}] } }
      workflow:
        object: "@ex2"
        steps:
          - { action: Submit, expect_stage: Review }
          - { action: Rework, expect_stage: Draft, expect_fields: { "{{KEY}}-Exc:Status": Draft } }
    - name: submit blocked without justification
      create:
        - { ref: ex3, type: {{KEY}}Exception, name: "{{CODE}}-TEST No Justification {run}", parent: "@process",
            fields: { "{{KEY}}-Exc:Risk Rating": Low, "{{KEY}}-Exc:Requested Expiry": "2026-12-31", "{{KEY}}-Exc:Exception Owner": [{{OWNER}}] } }
      workflow:
        object: "@ex3"
        steps:
          - { action: Submit, expect_error: true, expect_stage: Draft }
    - name: approve blocked with no controls
      create:
        - { ref: ex4, type: {{KEY}}Exception, name: "{{CODE}}-TEST No Controls {run}", parent: "@process",
            fields: { "{{KEY}}-Exc:Risk Rating": Medium, "{{KEY}}-Exc:Justification": "x",
                      "{{KEY}}-Exc:Requested Expiry": "2026-12-31", "{{KEY}}-Exc:Exception Owner": [{{OWNER}}] } }
      workflow:
        object: "@ex4"
        steps:
          - { action: Submit,  expect_stage: Review, expect_fields: { "{{KEY}}-Exc:Requested Expiry": "2026-12-31" } }   # date round trip
          - { action: Approve, expect_error: true, expect_stage: Review }
    - name: approve blocked while a control is proposed
      create:
        - { ref: ex5, type: {{KEY}}Exception, name: "{{CODE}}-TEST Proposed Control {run}", parent: "@process",
            fields: { "{{KEY}}-Exc:Risk Rating": Medium, "{{KEY}}-Exc:Justification": "x",
                      "{{KEY}}-Exc:Requested Expiry": "2026-12-31", "{{KEY}}-Exc:Exception Owner": [{{OWNER}}] } }
        - { ref: c5, type: {{KEY}}Control, name: "{{CODE}}-TEST Proposed {run}", parent: "@ex5",
            fields: { "{{KEY}}-Ctl:Control Description": "Not in place yet" } }   # Status defaults to Proposed
      workflow:
        object: "@ex5"
        steps:
          - { action: Submit,  expect_stage: Review }
          - { action: Approve, expect_error: true, expect_stage: Review }
    - name: reject ends the workflow
      create:
        - { ref: ex6, type: {{KEY}}Exception, name: "{{CODE}}-TEST Reject {run}", parent: "@process",
            fields: { "{{KEY}}-Exc:Risk Rating": Low, "{{KEY}}-Exc:Justification": "x",
                      "{{KEY}}-Exc:Requested Expiry": "2026-12-31", "{{KEY}}-Exc:Exception Owner": [{{OWNER}}] } }
      workflow:
        object: "@ex6"
        steps:
          - { action: Submit, expect_stage: Review }
          - { action: Reject, expect_state: completed }

# Lesson 10. Built in the Questionnaire Template Editor; this section is the design record.
questionnaires:
  - name: "{{KEY}} Process Policy Readiness"
    description: "Tutorial ({{CODE}}): checks a process against the access and retention policies"
    scoring: simple
    format: { titles: false, auto_numbering: true, weight_and_score: true }
    lifecycle: 3 Stage Lifecycle (with review)
    asset_types: [SOXProcess]
    folder: "Library > Questionnaire Templates"
    owners: { primary: {{OWNER}}, reviewer: {{OWNER}}, approver: null }
    sections:
      - title: Access
        weight: 1
        subsections:
          - title: Privileged access
            weight: 1
            questions:
              - { id: q1, type: single, required: true, weight: 1,
                  text: "Are all privileged accounts used by ${asset.name} protected with MFA?",
                  answers: [ { text: "Yes", score: 10 }, { text: "No", score: 0 } ] }
              - { id: q2, type: long_text, required: true, text: "Which accounts are not protected, and why?",
                  show_when: { conditions: [ { question: q1, in: ["No"] } ] } }
              - { id: q3, type: multiple, required: true, weight: 1, text: "Which compensating measures are in place?",
                  answers: [ { text: Session monitoring, score: 10 }, { text: Quarterly access review, score: 10 },
                             { text: None of the above, score: -1, exclusive: true } ] }
      - title: Retention
        weight: 1
        subsections:
          - title: Records
            weight: 1
            questions:
              - { id: q4, type: single, required: true, weight: 1, text: "Are records kept for the period the retention policy requires?",
                  answers: [ { text: Always, score: 10 }, { text: Mostly, score: 5 }, { text: "No", score: 0 } ] }
              - { id: q5, type: date, required: false, text: "When was retention last reviewed?" }   # not scored
    response_actions:
      # Response actions ignore views: every field required AT CREATION must be set here (Status has a default,
      # Risk Rating is set). The new exception starts {{KEY}} Exception Lifecycle (start: auto) in Draft.
      - name: Exception for unprotected privileged accounts
        when: { conditions: [ { question: q1, in: ["No"] } ] }
        operation: create_object
        child_type: {{KEY}}Exception
        object_name: "{{CODE}} MFA gap"
        skip_if_exists: true
        set: { "Description": "Raised by questionnaire: privileged accounts without MFA", "{{KEY}}-Exc:Risk Rating": "High" }
      - name: Exception for retention gap
        when: { conditions: [ { question: q4, in: ["No"] } ] }
        operation: create_object
        child_type: {{KEY}}Exception
        object_name: "{{CODE}} Retention gap"
        skip_if_exists: true
        set: { "Description": "Raised by questionnaire: records not kept for the required period", "{{KEY}}-Exc:Risk Rating": "Medium" }
    workflow:
      # SHARED workflow: you do NOT edit it. The response-action operation below runs the response actions that each
      # template defines, so once it is on the workflow every template's actions work. Lesson 10 checks that it is there;
      # if it is missing, adding it is a shared change for the environment owner, not for you.
      name: Questionnaire Assessment Workflow
      operations:
        - { stage: Review,                action: Approve and Close, operation: questionnaire_response_action }
        - { stage: Approval,              action: Approve and Close, operation: questionnaire_response_action, note: "4-stage lifecycle programs" }
        - { stage: Information Gathering, action: Submit and Close,  operation: questionnaire_response_action, note: "2-stage lifecycle (no review)" }
    ai_models: []
    tests:
      - name: fully compliant
        answers: { q1: "Yes", q3: [Session monitoring, Quarterly access review], q4: Always }
        expect: { compliance: 100, risk: 0, hidden: [q2] }
      - name: MFA gap, nothing compensating
        answers: { q1: "No", q2: "Two break-glass accounts", q3: [None of the above], q4: Mostly }
        expect: { compliance: 25, risk: 15, hidden: [] }
        expect_objects: [ { type: {{KEY}}Exception, name: "{{CODE}} MFA gap", under: asset } ]
      - name: retention gap only
        answers: { q1: "Yes", q3: [Session monitoring], q4: "No" }
        expect: { compliance: 50, risk: 15, hidden: [q2] }
        expect_objects: [ { type: {{KEY}}Exception, name: "{{CODE}} Retention gap", under: asset } ]
